experiment: baseline-vs-cached
seed: 42
repeats: 3

pricing:
  deepseek-chat:
    input_cache_hit_per_mtok: 0.07
    input_cache_miss_per_mtok: 0.27
    output_per_mtok: 1.10

configs:
  - name: plain-naive
    model: deepseek-chat
    agent: plain
    system_prompt: ../eval_lab/prompts/system_plain.txt
    layout: naive
    temperature: 0.0
    max_attempts: 3

  - name: plain-cache-optimized
    model: deepseek-chat
    agent: plain
    system_prompt: ../eval_lab/prompts/system_static_first.txt
    layout: static_first
    temperature: 0.0
    max_attempts: 3

  - name: tools-agent
    model: deepseek-chat
    agent: tools
    system_prompt: ../eval_lab/prompts/system_tools.txt
    layout: static_first
    temperature: 0.0
    max_tool_steps: 8
